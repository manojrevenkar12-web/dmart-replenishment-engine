[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "dmart-replenishment-engine"
version = "1.0.0"
description = "Probabilistic demand forecasting and perishable-aware replenishment optimisation for quick-commerce dark stores, benchmarked on the M5 retail dataset."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Manoj Kumar Prakash" }]
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "pyarrow>=15",
  "scipy>=1.12",
  "scikit-learn>=1.5",
  "lightgbm>=4.3",
  "pyyaml>=6",
  "matplotlib>=3.8",
  "fastapi>=0.110",
  "pydantic>=2.6",
  "uvicorn>=0.29",
]

[project.optional-dependencies]
torch = ["torch>=2.2"]
llm = ["anthropic>=0.40"]
dev = ["pytest>=8", "ruff>=0.6", "httpx>=0.27"]

[project.scripts]
dre = "dre.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 160
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
